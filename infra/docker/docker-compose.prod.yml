services:

  techclient-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: techclient-db
    environment:
      SA_PASSWORD: ${DB_PASSWORD}   
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
    volumes:
      - techclient-db-data:/var/opt/mssql
    networks:
      - techclient-network
    restart: unless-stopped

  techclient-api:
    build:
      context: ../../
      dockerfile: backend/TechClient.API/Dockerfile
    container_name: techclient-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=techclient-db;Database=${DB_NAME};User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      Dialogflow__ProjectId: ${DIALOGFLOW_PROJECT_ID}
      Dialogflow__AgentId: ${DIALOGFLOW_AGENT_ID}
      Dialogflow__Location: ${DIALOGFLOW_LOCATION}
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      OpenAI__Model: ${OPENAI_MODEL}
    ports:
      - "8080:8080"
    depends_on:
      - techclient-db
    networks:
      - techclient-network
    restart: unless-stopped

  techclient-web:
    build:
      context: ../../frontend/techclient-web
      dockerfile: Dockerfile
    container_name: techclient-web
    ports:
      - "80:80"
    depends_on:
      - techclient-api
    networks:
      - techclient-network
    restart: unless-stopped

volumes:
  techclient-db-data:

networks:
  techclient-network:
    driver: bridge