services:

  techclient-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: techclient-db
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
    volumes:
      - techclient-db-data:/var/opt/mssql
    networks:
      - techclient-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  techclient-api:
    build:
      context: ../../
      dockerfile: backend/TechClient.API/Dockerfile
    container_name: techclient-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=techclient-db;Database=${DB_NAME};User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      Dialogflow__ProjectId: ${DIALOGFLOW_PROJECT_ID}
      Dialogflow__AgentId: ${DIALOGFLOW_AGENT_ID}
      Dialogflow__Location: ${DIALOGFLOW_LOCATION}
      OpenAI__ApiKey: ${OpenAI__ApiKey}
      OpenAI__Model: ${OpenAI__Model}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/techclient-dialogflow.json
    ports:
      - "8080:8080"

    depends_on:
      techclient-db:
        condition: service_healthy

    networks:
      - techclient-network
    restart: unless-stopped

  techclient-web:
    build:
      context: ../../frontend/techclient-web
      dockerfile: Dockerfile
    container_name: techclient-web
    ports:
      - "80:80"
    depends_on:
      - techclient-api
    networks:
      - techclient-network
    restart: unless-stopped

volumes:
  techclient-db-data:

networks:
  techclient-network:
    driver: bridge